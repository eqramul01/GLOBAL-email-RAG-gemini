<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Gemini Email Search</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: Canvas;
    --fg: CanvasText;
    --muted: GrayText;
    --border: rgba(127,127,127,0.35);
    --accent: #1a73e8;
    --accent-bg: rgba(26,115,232,0.10);
  }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  body { width: 480px; min-height: 600px; }
  header { padding: 10px 12px; border-bottom: 1px solid var(--border); }
  .tabs { display: flex; gap: 4px; margin-top: 8px; }
  .tab { padding: 6px 12px; cursor: pointer; border-radius: 6px 6px 0 0;
    border: 1px solid var(--border); border-bottom: none; background: transparent; }
  .tab.active { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
  main { padding: 10px 12px; }
  .row { display: flex; gap: 6px; margin-bottom: 8px; }
  input[type=text], textarea {
    flex: 1; padding: 6px 8px; border: 1px solid var(--border);
    border-radius: 6px; background: var(--bg); color: var(--fg); font: inherit;
  }
  textarea { min-height: 64px; resize: vertical; }
  button { padding: 6px 12px; border: 1px solid var(--border);
    border-radius: 6px; background: var(--accent); color: white;
    cursor: pointer; font: inherit; }
  button:disabled { opacity: 0.5; cursor: progress; }
  .hint { color: var(--muted); font-size: 11px; }
  .results { margin-top: 12px; }
  .hit { padding: 8px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .hit:hover { background: var(--accent-bg); }
  .hit .subject { font-weight: 600; margin-bottom: 2px; }
  .hit .meta { color: var(--muted); font-size: 11px; }
  .hit .folder { color: var(--accent); font-size: 11px; }
  .answer { white-space: pre-wrap; padding: 10px; border: 1px solid var(--border);
    border-radius: 6px; margin-top: 8px; background: var(--accent-bg); }
  .sources { margin-top: 8px; }
  .sources h4 { margin: 8px 0 4px; }
  .err { color: #b00020; padding: 8px; }
  #status { padding: 6px 12px; font-size: 11px; color: var(--muted);
    border-top: 1px solid var(--border); }
  .panel { display: none; }
  .panel.active { display: block; }
</style>
</head>
<body>

<header>
  <div><strong>Gemini Email Archive</strong></div>
  <div class="tabs">
    <div class="tab active" data-panel="search">Search</div>
    <div class="tab" data-panel="ask">Ask</div>
  </div>
</header>

<main>
  <section id="panel-search" class="panel active">
    <div class="row">
      <input id="q" type="text" placeholder="Semantic search… e.g. wire instructions Muskat closing" />
      <button id="searchBtn">Search</button>
    </div>
    <div class="hint">Click any result to open it inside Thunderbird.</div>
    <div id="searchResults" class="results"></div>
  </section>

  <section id="panel-ask" class="panel">
    <div class="row">
      <textarea id="askQ" placeholder="Ask a question, e.g. Summarize correspondence about the Muskat closing"></textarea>
    </div>
    <div class="row">
      <select id="modelPick">
        <option value="">default (gemini-3.1-pro-preview)</option>
        <option value="gemini-3.1-pro-preview">3.1 Pro Preview · best reasoning</option>
        <option value="gemini-3-flash-preview">3 Flash Preview · faster</option>
        <option value="gemini-3.1-flash-lite">3.1 Flash-Lite · cheapest</option>
        <option value="gemini-2.5-pro">2.5 Pro · stable fallback</option>
        <option value="gemini-2.5-flash">2.5 Flash · stable fallback</option>
      </select>
      <button id="askBtn">Ask</button>
    </div>
    <div id="askAnswer"></div>
  </section>
</main>

<div id="status">Bridge: checking…</div>

<script src="sidebar.js"></script>
</body>
</html>
